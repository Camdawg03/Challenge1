<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Playing Cards</title>
    <link rel="stylesheet" href="sytle.css">
    <h1>Planetary Playing Cards</h1>
</head>
<body>
    <div class="sun">
        <img alt="Sun" src="sun.jpeg">
        <h1>Sun</h1>
        <h2>Type G2V</h2>
    </div>
    <div class="mercury">
        <img alt="Mercury" src="mercury.jpeg">
        <h1>Mercury</h1>
        <h2>AU distance: 0.39</h2>
    </div>
    <div class="venus">
        <img alt="Venus" src="venus.jpeg">
        <h1>Venus</h1>
        <h2>AU distance: 0.72</h2>
    </div>
    <div class="earth">
        <img alt="Earth" src="earth.jpeg.png.webp">
        <h1>Earth</h1>
        <h2>AU distance: 1.00</h2>
    </div>
    <div class="mars">
        <img alt="mars" src="mars.jpeg.png">
        <h1>Mars</h1>
        <h2>AU distance: 1.52</h2>
    </div>
    <div class="jupiter">
        <img alt="jupiter" src="jupiter.png">
        <h1>Jupiter</h1>
        <h2>AU distance: 5.20</h2>
    </div>
    <div class="saturn">
        <img alt="saturn" src="saturn.jpeg">
        <h1>Saturn</h1>
        <h2>AU distance: 9.54</h2>
    </div>
    <div class="uranus">
        <img alt="uranus" src="uranus.png">
        <h1>Uranus</h1>
        <h2>AU distance: 19.22</h2>
    </div>
    <div class="neptune">
        <img alt="neptune" src="neptune.jpeg">
        <h1>Neptune</h1>
        <h2>AU distance: 30.06</h2>
    </div>
</body>
</html>
